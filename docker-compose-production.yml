services:
  veil-game-dev:
    image: veil-server:dev
    container_name: veil-game-dev
    ports:
      - "${DEV_PORT:-8080}:8080"
    volumes:
      - /root/veil_data_dev:/app/data
      - /root/firebase-service-account-dev.json:/app/firebase-service-account.json
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-service-account.json
      - PORT=8080
      - ENABLE_VOICE_CHAT=${ENABLE_VOICE_CHAT:-false}
      - ENABLE_DAILY_CHALLENGES=${ENABLE_DAILY_CHALLENGES:-false}
      - ENABLE_TOURNAMENTS=${ENABLE_TOURNAMENTS:-false}
      - ENABLE_ADMIN_DASHBOARD=${ENABLE_ADMIN_DASHBOARD:-true}
      - ADMIN_UIDS=${ADMIN_UIDS}
      - MAX_PLAYERS=${MAX_PLAYERS:-10}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  veil-game-prod:
    image: veil-server:prod
    container_name: veil-game-prod
    ports:
      - "${PROD_PORT:-8081}:8080"
    volumes:
      - /root/veil_data_prod:/app/data
      - /root/firebase-service-account-prod.json:/app/firebase-service-account.json
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-service-account.json
      - PORT=8080
      - ENABLE_VOICE_CHAT=${ENABLE_VOICE_CHAT:-false}
      - ENABLE_DAILY_CHALLENGES=${ENABLE_DAILY_CHALLENGES:-false}
      - ENABLE_TOURNAMENTS=${ENABLE_TOURNAMENTS:-false}
      - ENABLE_ADMIN_DASHBOARD=${ENABLE_ADMIN_DASHBOARD:-true}
      - ADMIN_UIDS=${ADMIN_UIDS}
      - MAX_PLAYERS=${MAX_PLAYERS:-10}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
