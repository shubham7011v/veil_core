name: Veil CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*-internal", "v*-alpha", "v*-beta", "v*-prod", "v*-dev" ]
  pull_request:
    branches: [ "main" ]

env:
  FLUTTER_VERSION: "3.24.0"
  JAVA_VERSION: "17"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

  deploy:
    name: Build & Deploy
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set Variables
        id: vars
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION_NAME=$(echo $TAG | cut -d'-' -f1)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          
          if [[ $TAG == *"dev"* || $TAG == *"internal"* ]]; then
            # SIMPLE DEV & INTERNAL: APK + Dev Rules. No Play Store.
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "flavor=dev" >> $GITHUB_OUTPUT
            echo "entry=lib/main_dev.dart" >> $GITHUB_OUTPUT
            echo "build_type=apk" >> $GITHUB_OUTPUT
            
            # Dev & Internal REQUIRE dev branch
            if git branch -r --contains HEAD | grep -q "origin/dev"; then
              echo "is_on_correct_branch=true" >> $GITHUB_OUTPUT
            else
              echo "is_on_correct_branch=false" >> $GITHUB_OUTPUT
            fi
          else
            # PROD STORE PIPELINE (Alpha, Beta, Prod)
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "flavor=prod" >> $GITHUB_OUTPUT
            echo "entry=lib/main_prod.dart" >> $GITHUB_OUTPUT
            echo "build_type=appbundle" >> $GITHUB_OUTPUT
            
            if [[ $TAG == *"alpha"* ]]; then 
              echo "track=alpha" >> $GITHUB_OUTPUT
              # Open testing (Alpha) REQUIRES dev branch
              if git branch -r --contains HEAD | grep -q "origin/dev"; then
                echo "is_on_correct_branch=true" >> $GITHUB_OUTPUT
              else
                echo "is_on_correct_branch=false" >> $GITHUB_OUTPUT
              fi
            elif [[ $TAG == *"beta"* ]]; then 
              echo "track=beta" >> $GITHUB_OUTPUT
              # Closed testing (Beta) REQUIRES main branch
              if git branch -r --contains HEAD | grep -q "origin/main"; then
                echo "is_on_correct_branch=true" >> $GITHUB_OUTPUT
              else
                echo "is_on_correct_branch=false" >> $GITHUB_OUTPUT
              fi
            else 
              echo "track=production" >> $GITHUB_OUTPUT
              # Production REQUIRES main branch
              if git branch -r --contains HEAD | grep -q "origin/main"; then
                echo "is_on_correct_branch=true" >> $GITHUB_OUTPUT
              else
                echo "is_on_correct_branch=false" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties

      - name: Build App
        if: steps.vars.outputs.is_on_correct_branch == 'true'
        run: |
          flutter build ${{ steps.vars.outputs.build_type }} \
            --flavor ${{ steps.vars.outputs.flavor }} \
            -t ${{ steps.vars.outputs.entry }} \
            --build-name=${{ steps.vars.outputs.version_name }} \
            --build-number=${{ github.run_number }} \
            --release

      - name: Upload APK (Dev/Internal only)
        if: steps.vars.outputs.env == 'dev' && steps.vars.outputs.is_on_correct_branch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-apk
          path: build/app/outputs/flutter-apk/app-dev-release.apk

      - name: Deploy Firebase Rules (Dev)
        if: steps.vars.outputs.env == 'dev' && steps.vars.outputs.is_on_correct_branch == 'true'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,storage:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          PROJECT_ID: "veil-dev-shubham"

      - name: Deploy Firebase Rules (Prod)
        if: steps.vars.outputs.env == 'prod' && steps.vars.outputs.is_on_correct_branch == 'true'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,storage:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          PROJECT_ID: "veil-prod-shubham"

      - name: Deploy to Play Store (Prod only)
        if: steps.vars.outputs.env == 'prod' && steps.vars.outputs.is_on_correct_branch == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.veil.bluff
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ steps.vars.outputs.track }}
          status: completed
          whatsNewDir: distribution/whatsnew
