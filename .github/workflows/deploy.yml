name: Deploy to Hostinger

on:
    push:
        branches: ["main"]
        tags: ["go_v*"]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: SSH & Deploy (Build on Server)
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      # 1. Update Code
                      cd ~/veil_core
                      git fetch --all
                      git checkout main
                      git pull origin main

                      # 2. Build Image Locally (No Docker Hub needed)
                      cd server
                      docker build --network=host -t veil-server .

                      # 3. Restart Container
                      docker stop veil-game || true
                      docker rm veil-game || true

                      docker run -d \
                        --name veil-game \
                        -p 8080:8080 \
                        --restart unless-stopped \
                        -v /home/veilapp/data:/root/data \
                        -e ENABLE_VOICE=false \
                        veil-server
