name: Deploy to Hostinger

on:
    push:
        tags: ["go_v*"]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: SSH & Deploy (Build on Server)
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      # 1. Update Code
                      cd ~/veil_core
                      git fetch --all
                      git checkout ${{ github.ref_name }}
                      git pull origin ${{ github.ref_name }}

                      # 2. Build Image
                      cd server
                      docker build --network=host -t veil-server .

                      # 3. Restart Container
                      docker stop veil-game || true
                      docker rm veil-game || true

                      docker run -d \
                        --name veil-game \
                        -p 8080:8080 \
                        --restart unless-stopped \
                        -v /home/veilapp/data:/root/data \
                        -e ENABLE_VOICE=false \
                        -e FIREBASE_CREDENTIALS_JSON='${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}' \
                        -e ADMIN_UIDS='${{ secrets.ADMIN_UIDS }}' \
                        veil-server

                      # 4. Health Check
                      echo "Waiting for server to start..."
                      sleep 5
                      
                      # Check if container is running
                      if [ "$(docker inspect -f '{{.State.Running}}' veil-game)" != "true" ]; then
                        echo "Error: Container failed to start!"
                        docker logs veil-game
                        exit 1
                      fi

                      # Check if API is responding
                      echo "Verifying API response..."
                      STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/config)
                      if [ "$STATUS_CODE" -ne 200 ]; then
                        echo "Error: API returned status code $STATUS_CODE"
                        docker logs veil-game
                        exit 1
                      fi

                      echo "✅ Deployment successful and verified!"
