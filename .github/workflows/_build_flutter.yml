name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string
      target:
        required: true
        type: string
      build_type:
        required: true
        type: string
      version_name:
        required: true
        type: string
      build_number:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_path:
        required: true
        type: string
      dart_defines:
        required: false
        type: string
        default: ""
    secrets:
      google_services_json_base64:
        required: true
      keystore_base64:
        required: true
      keystore_password:
        required: true
      key_alias:
        required: true
      key_password:
        required: true
      server_url:
        required: false
      api_url:
        required: false
      master_admin_id:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-flutter

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Secrets
        run: |
          # Keystore
          echo "${{ secrets.keystore_base64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.keystore_password }}" >> android/key.properties
          echo "keyPassword=${{ secrets.key_password }}" >> android/key.properties
          echo "keyAlias=${{ secrets.key_alias }}" >> android/key.properties

          # Google Services JSON
          echo "${{ secrets.google_services_json_base64 }}" | base64 --decode > android/app/src/${{ inputs.flavor }}/google-services.json

      - name: Build App
        env:
          SERVER_URL: ${{ secrets.server_url }}
          API_URL: ${{ secrets.api_url }}
          MASTER_ADMIN_ID: ${{ secrets.master_admin_id }}
        run: |
          DART_DEFINES="${{ inputs.dart_defines }}"
          if [ ! -z "$SERVER_URL" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=SERVER_URL=$SERVER_URL"
          fi
          if [ ! -z "$API_URL" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=API_URL=$API_URL"
          fi
          if [ ! -z "$MASTER_ADMIN_ID" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=MASTER_ADMIN_ID=$MASTER_ADMIN_ID"
          fi

          flutter build ${{ inputs.build_type }} \
            --flavor ${{ inputs.flavor }} \
            -t ${{ inputs.target }} \
            --build-name=${{ inputs.version_name }} \
            --build-number=${{ inputs.build_number }} \
            $DART_DEFINES \
            --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
