name: Deploy Firebase Rules

on:
  push:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firestore.indexes.json"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
          - both

jobs:
  deploy-dev:
    name: Deploy to Dev
    if: github.event_name == 'push' || inputs.environment == 'dev' || inputs.environment == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud (Dev)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Rules
        run: firebase deploy --only firestore:rules,storage --project "veil-dev-shubham"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  deploy-prod:
    name: Deploy to Prod
    if: github.event_name == 'push' || inputs.environment == 'prod' || inputs.environment == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud (Prod)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Rules
        run: firebase deploy --only firestore:rules,storage --project "veil-prod-shubham"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
