name: Veil App CD (Production)

on:
  push:
    tags:
      - "app_prod_v*"
      - "go_prod_v*" # Triggers both

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.vars.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Variables
        id: vars
        run: |
          TAG_NAME=${{ github.ref_name }}
          # Handle both app_prod_v1.0 and go_prod_v1.0
          VERSION_NAME=${TAG_NAME#*_prod_v}
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

  build:
    name: Build Prod AAB/APK
    needs: vars
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-flutter

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Secrets
        run: |
          # Keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n ' | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties

          # Google Services JSON
          mkdir -p android/app/src/prod
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '\n ' | base64 --decode > android/app/src/prod/google-services.json

          # satisfy pubspec.yaml requirement for .env file
          touch .env

      - name: Setup Build Number
        run: |
          OFFSET=${{ vars.VERSION_CODE_OFFSET }}
          OFFSET=${OFFSET:-0}
          RUN_NUMBER=${{ github.run_number }}
          BUILD_NUMBER=$((OFFSET + RUN_NUMBER))
          echo "Final Build Number: $BUILD_NUMBER (Offset: $OFFSET, Run: $RUN_NUMBER)"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: Build App (AAB)
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          API_URL: ${{ secrets.API_URL }}
          MASTER_ADMIN_ID: ${{ secrets.ADMIN_UIDS }}
          ENABLE_GAME_CHAT: ${{ secrets.ENABLE_GAME_CHAT }}
        run: |
          DART_DEFINES="--dart-define=ENV=production"
          if [ ! -z "$SERVER_URL" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=SERVER_URL=$SERVER_URL"
          fi
          if [ ! -z "$API_URL" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=API_URL=$API_URL"
          fi
          if [ ! -z "$MASTER_ADMIN_ID" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=MASTER_ADMIN_ID=$MASTER_ADMIN_ID"
          fi
          if [ ! -z "$ENABLE_GAME_CHAT" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=ENABLE_GAME_CHAT=$ENABLE_GAME_CHAT"
          fi

          mkdir -p build/app/outputs/symbols
          flutter build appbundle \
            --flavor prod \
            -t lib/main_prod.dart \
            --build-name=${{ needs.vars.outputs.version_name }} \
            --build-number=$BUILD_NUMBER \
            --split-debug-info=build/app/outputs/symbols \
            --tree-shake-icons \
            $DART_DEFINES \
            --release

      - name: Build App (APK)
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          API_URL: ${{ secrets.API_URL }}
          MASTER_ADMIN_ID: ${{ secrets.ADMIN_UIDS }}
          ENABLE_GAME_CHAT: ${{ secrets.ENABLE_GAME_CHAT }}
        run: |
          DART_DEFINES="--dart-define=ENV=production"
          if [ ! -z "$SERVER_URL" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=SERVER_URL=$SERVER_URL"
          fi
          if [ ! -z "$API_URL" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=API_URL=$API_URL"
          fi
          if [ ! -z "$MASTER_ADMIN_ID" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=MASTER_ADMIN_ID=$MASTER_ADMIN_ID"
          fi
          if [ ! -z "$ENABLE_GAME_CHAT" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=ENABLE_GAME_CHAT=$ENABLE_GAME_CHAT"
          fi

          flutter build apk \
            --flavor prod \
            -t lib/main_prod.dart \
            --build-name=${{ needs.vars.outputs.version_name }} \
            --build-number=$BUILD_NUMBER \
            --split-debug-info=build/app/outputs/symbols \
            --tree-shake-icons \
            $DART_DEFINES \
            --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: prod-release-bundle
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prod-release-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk

  deploy_play_store:
    name: Deploy to Play Store
    needs: [vars, build]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-release-bundle
          path: build/app/outputs/bundle/prodRelease/

      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.veil.bluff
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: draft
          whatsNewDirectory: distribution/whatsnew

  create_release:
    name: Create GitHub Release (Prod)
    needs: [vars, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/prod-release-bundle/app-prod-release.aab
            artifacts/prod-release-apk/app-prod-release.apk
          tag_name: ${{ github.ref_name }}
          name: Prod Release ${{ needs.vars.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
