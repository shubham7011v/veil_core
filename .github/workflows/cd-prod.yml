name: Veil CD (Production)

on:
  push:
    tags:
      - "v*"
      # Note: We filter in the jobs to avoid double-running if it's a dev tag,
      # but standardizing v* for production-type releases.

jobs:
  vars:
    if: "!contains(github.ref, '-dev') && !contains(github.ref, '-internal')"
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.vars.outputs.version_name }}
      track: ${{ steps.vars.outputs.track }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Variables
        id: vars
        uses: ./.github/actions/extract-vars

  build:
    needs: vars
    uses: ./.github/workflows/_build_flutter.yml
    with:
      flavor: prod
      target: lib/main_prod.dart
      build_type: appbundle
      version_name: ${{ needs.vars.outputs.version_name }}
      build_number: ${{ github.run_number }}
      artifact_name: prod-release-bundle
      artifact_path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
      dart_defines: "--dart-define=ENV=production"
    secrets:
      keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
      server_url: ${{ secrets.PROD_SERVER_URL }}
      api_url: ${{ secrets.PROD_API_URL }}
      master_admin_id: ${{ secrets.MASTER_ADMIN_ID }}

  deploy_play_store:
    name: Deploy to Play Store
    needs: [vars, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-release-bundle
          path: build/app/outputs/bundle/prodRelease/

      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.veil.bluff
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ needs.vars.outputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

  create_release:
    name: Create GitHub Release
    needs: [vars, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-release-bundle
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/app-prod-release.aab
          tag_name: ${{ github.ref_name }}
          name: Production Release ${{ needs.vars.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
