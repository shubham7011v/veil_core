name: Veil CD (Development)

on:
  push:
    tags:
      - "v*-dev"
      - "v*-internal"

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.vars.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Variables
        id: vars
        uses: ./.github/actions/extract-vars

  build:
    needs: vars
    uses: ./.github/workflows/_build_flutter.yml
    with:
      flavor: dev
      target: lib/main_dev.dart
      build_type: apk
      version_name: ${{ needs.vars.outputs.version_name }}
      build_number: ${{ github.run_number }}
      artifact_name: dev-release-apk
      artifact_path: build/app/outputs/flutter-apk/app-dev-release.apk
      dart_defines: "--dart-define=ENV=development"
    secrets:
      keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
      server_url: ${{ secrets.DEV_SERVER_URL }}
      api_url: ${{ secrets.DEV_API_URL }}
      master_admin_id: ${{ secrets.MASTER_ADMIN_ID }}

  release:
    name: Create GitHub Release
    needs: [vars, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-release-apk
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/app-dev-release.apk
          tag_name: ${{ github.ref_name }}
          name: Dev Release ${{ needs.vars.outputs.version_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
